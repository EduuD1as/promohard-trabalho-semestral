<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/products.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-container">
          <div class="h1Home">
            <a href="#">
              <h1>Promohard</h1>
            </a>
          </div>
          <div class="search-container">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar produtos..."
              style="font-family: 'Inter'; font-size: 12px;"
            />
            <button id="search-button"><img src="" alt=""></button>
          </div>
          <nav>
            <ul id="nav-options">
              <li><a href="#">Sobre</a></li>
              <li id="create-account">
                <a href="../pages/cadastro.html">Criar Conta</a>
              </li>
              <li id="login"><a href="../pages/login.html">Fazer Login</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <div id="divNav">
        <nav>
          <a href="javascript:void(0)" data-category="cpu">PROCESSADOR</a>
          <a href="javascript:void(0)" data-category="mobo">PLACA MÃE</a>
          <a href="javascript:void(0)" data-category="gpu">PLACA DE VÍDEO</a>
          <a href="javascript:void(0)" data-category="ram">MEMÓRIA</a>
          <a href="javascript:void(0)" data-category="ssd">SSD</a>
          <a href="javascript:void(0)" data-category="hdd">HDD</a>
          <a href="javascript:void(0)" data-category="psu">FONTE</a>
          <a href="javascript:void(0)" data-category="cooling"
            >RESFRIAMENTO & VENTOINHAS</a
          >
          <a href="javascript:void(0)" data-category="case">GABINETE</a>
        </nav>
      </div>

      <!-- Contêiner principal para barra lateral e grid de produtos -->
      <div class="main-content">
        <aside class="filter-sidebar">
          <div class="filter-group">
            <h3>Marcas</h3>
            <div id="filters"></div>
          </div>
          <div class="filter-group">
            <h3>Preços</h3>
            <label>
              <input type="radio" name="price" value="low" />
              <span>Até R$ 100</span>
            </label>
            <label>
              <input type="radio" name="price" value="medium" />
              <span>R$ 100 - R$ 500</span>
            </label>
            <label>
              <input type="radio" name="price" value="high" />
              <span>Acima de R$ 500</span>
            </label>
          </div>
          <div class="divButtonAplicar">
            <button>Aplicar Filtro</button>
          </div>
        </aside>

        <section id="produtos-grid" class="product-grid"></section>
      </div>
    </div>

    <div class="footer">
      <footer>
        <span>Próxima página</span>
      </footer>
    </div>

    <script src="../js/products.js"></script>
  </body>
</html>
